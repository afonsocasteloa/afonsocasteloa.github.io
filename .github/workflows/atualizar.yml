name: Atualizar Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [source]

concurrency:
  group: tracker-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Código do site
        uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npx playwright install --with-deps chrome firefox chromium

      - name: Ler o Tracker
        id: scrape
        timeout-minutes: 20
        env:
          CI: true
          PLAYWRIGHT_CHROMIUM_USE_HEADLESS_SHELL: "0"
        run: |
          set -e
          n=0
          until [ "$n" -ge 3 ]; do
            if node scripts/refresh-tracker.mjs; then
              exit 0
            fi
            n=$((n + 1))
            echo "Falhou a leitura $n, nova tentativa..."
            sleep 20
          done
          exit 1

      - name: Guardar live.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          git diff --staged --quiet || git commit -m "Atualizar live.json a partir do Tracker. [skip ci]"
          git push origin HEAD:source

      - name: Construir o site
        if: success()
        run: npm run build

      - name: Publicar GitHub Pages
        if: success()
        uses: actions/checkout@v4
        with:
          ref: main
          path: gh-pages-main

      - name: Copiar site estático
        if: success()
        run: |
          rsync -a --delete --exclude '.git' --exclude '.github' out/ gh-pages-main/
          cd gh-pages-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualizar o site com os dados mais recentes do Tracker."
          git push
