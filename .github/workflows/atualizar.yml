name: Atualizar Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [source]

concurrency:
  group: tracker-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Código do site
        uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - if: github.event_name != 'push'
        run: npx playwright install --with-deps chrome firefox chromium

      - name: Ler o Tracker
        if: github.event_name != 'push'
        id: scrape
        continue-on-error: true
        timeout-minutes: 20
        env:
          CI: true
          PLAYWRIGHT_CHROMIUM_USE_HEADLESS_SHELL: "0"
        run: npm run refresh

      - name: Guardar live.json
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          git diff --staged --quiet || git commit -m "Refresh Tracker snapshot. [skip ci]"
          git push origin HEAD:source

      - name: Construir o site
        id: build
        if: github.event_name != 'schedule' || steps.scrape.outcome == 'success'
        run: npm run build

      - name: Publicar GitHub Pages
        if: steps.build.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: main
          path: gh-pages-main

      - name: Copiar site estático
        if: steps.build.outcome == 'success'
        run: |
          touch out/.nojekyll
          rsync -a --delete --exclude '.git' --exclude '.github' out/ gh-pages-main/
          cd gh-pages-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Publish static site."
          git push

      - name: Assinalar falha na recolha do Tracker
        if: '!cancelled() && steps.scrape.outcome == ''failure'''
        run: |
          echo '::error::Tracker refresh failed. The last snapshot was kept.'
          exit 1
